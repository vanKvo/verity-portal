name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      # --- Retrieve Deployment Configurations from SSM ---
      - name: Fetch Deployment Metadata from SSM
        id: ssm_fetch
        run: |
          echo "Fetching target resource identifiers from SSM Parameter Store..."
          
          FRONTEND_BUCKET=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/frontend_bucket" --query "Parameter.Value" --output text)
          CLOUDFRONT_DISTRIBUTION_ID=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/cloudfront_distribution_id" --query "Parameter.Value" --output text)
          BACKEND_LAMBDA_NAME=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/backend_lambda_name" --query "Parameter.Value" --output text)
          BACKEND_ECR_URL=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/backend_ecr_url" --query "Parameter.Value" --output text)
          DOMAIN_NAME=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/domain_name" --query "Parameter.Value" --output text)
          
          # Output to GITHUB_ENV for subsequent steps to access
          echo "FRONTEND_BUCKET=$FRONTEND_BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV
          echo "BACKEND_LAMBDA_NAME=$BACKEND_LAMBDA_NAME" >> $GITHUB_ENV
          echo "BACKEND_ECR_URL=$BACKEND_ECR_URL" >> $GITHUB_ENV
          echo "DOMAIN_NAME=$DOMAIN_NAME" >> $GITHUB_ENV
          
          # Fetch and mask sensitive database connection URL
          DATABASE_URL=$(aws ssm get-parameter --name "/verity-portal/${{ inputs.environment }}/database_url" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

      # --- Setup Platform Build Utilities ---
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js (for frontend compilation)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (for alembic migrations)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Python Dependencies
        run: |
          cd backend
          poetry install

      # --- Deploy Backend FastAPI Container ---
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin ${{ env.BACKEND_ECR_URL }}

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_ECR_URL }}:latest
            ${{ env.BACKEND_ECR_URL }}:${{ github.sha }}

      - name: Force Lambda Function Code Update
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.BACKEND_LAMBDA_NAME }} \
            --image-uri ${{ env.BACKEND_ECR_URL }}:${{ github.sha }} \
            --region ${{ inputs.aws_region }}

      # --- Run Database Migrations ---
      - name: Execute Alembic Database Migrations
        run: |
          cd backend
          DATABASE_URL="${{ env.DATABASE_URL }}" poetry run alembic upgrade head

      # --- Deploy Frontend Static Angular Site ---
      - name: Configure Frontend Production Environment API URL
        run: |
          echo "export const environment = { production: true, apiUrl: 'https://verityportal.${{ env.DOMAIN_NAME }}' };" > frontend/src/environments/environment.prod.ts

      - name: Install Frontend Dependencies & Build Angular
        run: |
          cd frontend
          npm install
          npm run build -- --configuration=production

      - name: Sync Frontend Assets to S3
        run: |
          aws s3 sync frontend/dist/frontend/browser s3://${{ env.FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
